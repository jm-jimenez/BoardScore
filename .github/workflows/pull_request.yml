name: Tests

on:
  pull_request:

jobs:
  tests:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme "BoardScore" \
            -workspace "BoardScore.xcworkspace" \
            -destination 'platform=iOS Simulator,name=iPhone 11'
