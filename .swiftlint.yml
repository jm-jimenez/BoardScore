# SwiftLint configuration for the whole BoardScore repo.
# Run from the repo root: `swiftlint lint` (Xcode does it on every build of the BoardScore target).

included:
  - BoardScore
  - BoardScoreData
  - BoardScoreDomain
  - BoardScorePresentation
  - Chartzs

excluded:
  - "**/.build"
  - "**/.swiftpm"
  - "**/DerivedData"

nesting:
  type_level: 2

type_name:
  excluded:
    - C

custom_rules:
  blank_line_after_guard:
    name: "Blank Line After Guard"
    regex: '^[ \t]*guard\b(?:(?!\belse\b)[\s\S])*?\belse[ \t]*\{[^{}]*\}[ \t]*\n(?![ \t]*\n)(?![ \t]*\})'
    message: "A guard statement must be followed by a blank line"
    severity: warning
